name: Delta Crypto Volume Alert

on:
  schedule:
    - cron: '*/5 * * * *'  # દર 5 મિનિટે રન થશે
  workflow_dispatch:        # મેન્યુઅલ રન માટે

jobs:
  run-alert-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Delta Scanner
        run: |
          python bot.py

      # આ સ્ટેપ રિપોઝીટરીને ક્યારેય સ્લીપ મોડમાં જવા નહીં દે
      - name: Keep Workflow Active
        uses: gautamkrishnar/keepalive-workflow@v2
